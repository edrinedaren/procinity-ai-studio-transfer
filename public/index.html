html{background:#000}
#app .card .chip{background:#000;border:1.5px solid #8a8a8f;color:var(--tx)}
#mgQ::placeholder{color:#fff!important;opacity:1}
#logo.brand{color:var(--act);-webkit-text-stroke:.8px #fff;paint-order:stroke fill;letter-spacing:.8px;font-weight:500}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:64px}

nav button:focus,nav button:active{outline:none}

#modal.show{display:flex}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:20}

        '<div>' +

                  ? '<div style="display:flex;gap:8px;margin-top:10px">' +
                      '<button class="sec" data-bpe="' + esc(p.id) + '" style="flex:1;padding:6px 10px;font-size:13px">Edit</button>' +
                      '<button class="sec" data-bpt="' + esc(p.id) + '" style="flex:1;padding:6px 10px;font-size:13px">' + (p.published ? "Unpublish" : "Publish") + "</button>" +
                    "</div>"
                  : "") +
              "</div>";
            }).join("") + "</div>" + outsideViewAllProds;

            var viewAllProdsBtn = el.querySelector("#bpViewAllProds");
            if (viewAllProdsBtn) viewAllProdsBtn.onclick = function () {
              if (!hasOthers) { toast("No other products to show"); return; }
              prodExpandedMap[biz.id] = true;
              drawProducts(items);
            };
            var showLessProdsBtn = el.querySelector("#bpShowLessProds");
            if (showLessProdsBtn) showLessProdsBtn.onclick = function () {
              prodExpandedMap[biz.id] = false;
              drawProducts(items);
            };

            var byId = {};
            items.forEach(function (p) { byId[p.id] = p; });
            Array.prototype.forEach.call(el.querySelectorAll("[data-bpv]"), function (b) {
              b.onclick = function () { openRegisteredProduct(byId[b.dataset.bpv] || b.dataset.bpv); };
            });
            Array.prototype.forEach.call(el.querySelectorAll("[data-bpe]"), function (b) {
              b.onclick = function () {
                var p = byId[b.dataset.bpe];
                if (p) openProductForm(biz.id, p, function () { if (onMutated) onMutated(); render(); });
              };
            });
            Array.prototype.forEach.call(el.querySelectorAll("[data-bpt]"), function (b) {
              b.onclick = function () {
                var p = byId[b.dataset.bpt];
                if (p) toggleProductPublish(p, function () { if (onMutated) onMutated(); render(); });
              };
            });
          }
          var add2 = el.querySelector("#bpAddProd2");
          if (add2) add2.onclick = function () {
            openProductForm(biz.id, null, function () { if (onMutated) onMutated(); render(); });
          };
        }
        drawProducts(list);
      }
      var addErr = el.querySelector("#bpAddProd2");
      if (addErr && !res.ok) addErr.onclick = function () {
        openProductForm(biz.id, null, function () { if (onMutated) onMutated(); render(); });
      };
    }, function () {
      if (!document.body.contains(el)) return;
      el.innerHTML = '<div class="name" style="font-size:17px;margin-bottom:8px">Products</div><p class="mu">Could not load products.</p>';
    });
  };
})();

/* ---------- Business Posts (Owner Latest Post & Reveal All) ---------- */
(function () {
  var expandedMap = {};

  function safePostImg(s) {
    if (typeof s !== "string" || !s) return "";
    if (s.startsWith("/api/images/") || s.startsWith("/images/") || s.startsWith("/assets/")) return s;
    if (/^https?:\/\//i.test(s)) return s;
    return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s) ? s : "";
  }

  function postAgo(ts) {
    var diff = Math.max(0, Math.floor((Date.now() - Number(ts || 0)) / 1000));
    if (diff < 60) return "Just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m";
    if (diff < 86400) return Math.floor(diff / 3600) + "h";
    if (diff < 604800) return Math.floor(diff / 86400) + "d";
    try { return new Date(Number(ts)).toLocaleDateString(); } catch (e) { return Math.floor(diff / 86400) + "d"; }
  }

  function confirmDeleteBizPost(post, onDeleted) {
    var ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px";
    ov.innerHTML = '<div role="dialog" aria-modal="true" style="width:100%;max-width:340px;background:var(--bg);border:1px solid var(--bd);border-radius:18px;padding:20px">' +
      '<div class="name" style="font-size:18px;line-height:1.3">Delete post?</div>' +
      '<p class="mu" style="margin:8px 0 0;font-size:14px">This removes the post permanently.</p>' +
      '<div id="bpdErr" style="color:#ff6b6b;font-size:13px;margin-top:10px"></div>' +
      '<div style="display:flex;gap:10px;margin-top:18px"><button class="sec" data-x="c" style="flex:1;border-radius:999px;padding:9px;font-size:15px">Cancel</button><button id="bpdGo" style="flex:1;border:0;border-radius:999px;padding:9px;font-size:15px;font-weight:600;background:#e5484d;color:#fff;cursor:pointer">Delete</button></div></div>';
    document.body.appendChild(ov);
    ov.onclick = function (e) { if (e.target === ov) ov.remove(); };
    ov.querySelector('[data-x="c"]').onclick = function () { ov.remove(); };
    ov.querySelector("#bpdGo").onclick = function () {
      var btn = this; btn.disabled = true; btn.textContent = "Deleting...";
      PX.api("DELETE", "business-posts/" + encodeURIComponent(post.id)).then(function (r) {
        if (!r.ok) { btn.disabled = false; btn.textContent = "Delete"; ov.querySelector("#bpdErr").textContent = (r.d && r.d.error) || "Could not delete post."; return; }
        ov.remove();
        toast("Post deleted");
        if (onDeleted) onDeleted();
      });
    };
  }

  function renderPostBodyHTML(biz, post) {
    var logoSrc = safePostImg(biz && biz.logo);
    var postImg = safePostImg(post && post.image);
    return '<div style="display:flex;align-items:center;gap:10px">' +
        (logoSrc ? '<img src="' + esc(logoSrc) + '" alt="" style="width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none;display:block;border:1px solid var(--bd)">' : "") +
        '<div style="min-width:0;flex:1">' +
          '<div class="name" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc((biz && biz.name) || "Business") + "</div>" +
          '<div class="mu" style="font-size:12px">' + esc(postAgo(post.created_at)) + "</div>" +
        "</div>" +
      "</div>" +
      '<div style="margin-top:10px;line-height:1.5;white-space:pre-wrap;word-break:break-word">' + esc(post.content || "") + "</div>" +
      (postImg ? '<img src="' + esc(postImg) + '" alt="" style="width:100%;height:auto;border-radius:10px;margin-top:10px;display:block;border:1px solid var(--bd)">' : "");
  }

  window.openBizPostForm = function (bizOrId, onSaved) {
    var bizId = typeof bizOrId === "object" && bizOrId ? bizOrId.id : String(bizOrId || "");
    if (!bizId) return;
    if (!window.PX || !PX.u) {
      authRun("Sign in to publish a post.", function () { openBizPostForm(bizOrId, onSaved); });
      return;
    }
    var old = $("bizPostFormPage"); if (old) old.remove();
    var img = "";
    var o = document.createElement("div");
    o.id = "bizPostFormPage";
    o.style.cssText = "position:fixed;inset:0;z-index:48;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)";
    o.innerHTML = '<div style="max-width:520px;margin:0 auto;padding:12px 14px 40px">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
        '<button id="bpfBack" aria-label="Back" style="border:0;background:none;color:var(--tx);padding:4px;line-height:0;cursor:pointer">' + BK + "</button>" +
        '<div class="name" style="font-size:20px">New post</div>' +
      "</div>" +
      '<form id="bpfForm" novalidate style="display:grid;gap:14px">' +
        '<div><div class="row" style="margin-bottom:4px"><span class="mu">Post *</span><span id="bpfCt" class="mu" style="font-size:12px">0/1000</span></div>' +
          '<textarea id="bpfText" rows="5" maxlength="1000" placeholder="Share an update, offer or announcement..."></textarea></div>' +
        '<div>' +
          '<div class="row" style="margin-bottom:8px"><span class="mu">Photo (optional)</span><button type="button" id="bpfImgPick" class="sec" style="padding:6px 12px;font-size:13px">Add photo</button></div>' +
          '<div id="bpfImgBox"></div>' +
        "</div>" +
        '<div id="bpfErr" style="color:#ff6b6b;font-size:14px"></div>' +
        '<button id="bpfSubmit" type="submit" class="pri" style="width:100%;padding:13px;font-size:16px">Publish post</button>' +
      "</form>" +
      "</div>";
    document.body.appendChild(o);

    function drawImg() {
      var box = o.querySelector("#bpfImgBox");
      var pick = o.querySelector("#bpfImgPick");
      pick.textContent = img ? "Change photo" : "Add photo";
      if (!img) { box.innerHTML = ""; return; }
      box.innerHTML = '<div style="position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--bd)">' +
        '<img src="' + esc(img) + '" alt="" style="width:100%;height:auto;display:block">' +
        '<button type="button" id="bpfImgRm" aria-label="Remove photo" style="position:absolute;top:8px;right:8px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:16px;line-height:1;padding:0;cursor:pointer">&times;</button>' +
      "</div>";
      o.querySelector("#bpfImgRm").onclick = function () { img = ""; drawImg(); };
    }

    function updateCt() {
      o.querySelector("#bpfCt").textContent = o.querySelector("#bpfText").value.length + "/1000";
    }

    drawImg();
    updateCt();

    o.querySelector("#bpfBack").onclick = function () { o.remove(); };
    o.querySelector("#bpfText").oninput = updateCt;
    o.querySelector("#bpfImgPick").onclick = function () {
      PX.pickPhoto(function (d) { img = d; drawImg(); }, { size: 720, fit: true, quality: 0.82 });
    };
    o.querySelector("#bpfForm").onsubmit = function (ev) {
      ev.preventDefault();
      var err = o.querySelector("#bpfErr");
      var btn = o.querySelector("#bpfSubmit");
      err.textContent = "";
      var content = o.querySelector("#bpfText").value.trim();
      if (!content) { err.textContent = "Write something for your post."; o.querySelector("#bpfText").focus(); return; }
      btn.disabled = true;
      btn.textContent = "Publishing...";
      PX.api("POST", "business-posts", { business_id: bizId, content: content, image: img }).then(function (r) {
        if (!r.ok) {
          btn.disabled = false;
          btn.textContent = "Publish post";
          err.textContent = (r.d && r.d.error) || "Could not publish post.";
          return;
        }
        expandedMap[bizId] = false;
        o.remove();
        toast("Post published");
        if (onSaved) onSaved(r.d && r.d.post);
      });
    };
  };

  window.loadBizPostsInto = function (el, biz, onMutated) {
    if (!el || !biz || !biz.id) return;
    el.innerHTML = '<div class="row" style="margin-bottom:10px"><div class="name" style="font-size:17px">Posts</div>' +
      (biz.is_owner ? '<button id="bpAddPost" class="pri" style="padding:6px 12px;font-size:13px">Add post</button>' : "") +
      '</div><p class="mu">Loading posts...</p>';
    var addTop = el.querySelector("#bpAddPost");
    if (addTop) addTop.onclick = function () {
      openBizPostForm(biz.id, function () { if (onMutated) onMutated(); render(); });
    };

    function drawPosts(list) {
      var header = '<div class="row" style="margin-bottom:10px"><div class="name" style="font-size:17px">Posts <span class="mu" style="font-weight:500;font-size:14px">(' + list.length + ")</span></div>" +
        (biz.is_owner ? '<button id="bpAddPost2" class="pri" style="padding:6px 12px;font-size:13px">Add post</button>' : "") +
        "</div>";
      if (!list.length) {
        el.innerHTML = header + '<div class="card pad"><p class="mu" style="margin:0">' + (biz.is_owner ? "You don't have any social posts" : "No social posts yet.") + "</p></div>";
      } else {
        var hasOthers = list.length > 1;
        var showAll = hasOthers && !!expandedMap[biz.id];
        var visible = showAll ? list : [list[0]];
        var chevRight = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
        var outsideViewAllPosts = '<div style="display:flex;justify-content:flex-end;margin-top:8px">' +
          (showAll
            ? '<button type="button" id="bpShowLessPosts" style="border:0;background:none;padding:2px 0;font:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:3px">Show less</button>'
            : '<button type="button" id="bpViewAllPosts" style="border:0;background:none;padding:2px 0;font:inherit;font-size:14px;font-weight:600;color:' + (hasOthers ? "#fff" : "var(--mu)") + ';cursor:' + (hasOthers ? "pointer" : "default") + ';display:inline-flex;align-items:center;gap:3px">View all' + chevRight + "</button>") +
        "</div>";
        el.innerHTML = header + '<div style="display:grid;gap:10px">' + visible.map(function (p) {
          var footer = biz.is_owner
            ? '<div style="display:flex;align-items:center;justify-content:flex-end;margin-top:10px">' +
                '<button type="button" data-bpdel="' + esc(p.id) + '" style="border:0;background:none;padding:2px 0;font:inherit;font-size:13px;color:#ff6b6b;cursor:pointer">Delete</button>' +
              "</div>"
            : "";
          return '<div class="card pad">' + renderPostBodyHTML(biz, p) + footer + "</div>";
        }).join("") + "</div>" + outsideViewAllPosts;

        var viewAllBtn = el.querySelector("#bpViewAllPosts");
        if (viewAllBtn) viewAllBtn.onclick = function () {
          if (!hasOthers) { toast("No other posts to show"); return; }
          expandedMap[biz.id] = true;
          drawPosts(list);
        };
        var showLessBtn = el.querySelector("#bpShowLessPosts");
        if (showLessBtn) showLessBtn.onclick = function () {
          expandedMap[biz.id] = false;
          drawPosts(list);
        };
        var byId = {};
        list.forEach(function (p) { byId[p.id] = p; });
        Array.prototype.forEach.call(el.querySelectorAll("[data-bpdel]"), function (btn) {
          btn.onclick = function () {
            var p = byId[btn.getAttribute("data-bpdel")];
            if (!p) return;
            confirmDeleteBizPost(p, function () { if (onMutated) onMutated(); render(); });
          };
        });
      }
      var add2 = el.querySelector("#bpAddPost2");
      if (add2) add2.onclick = function () {
        openBizPostForm(biz.id, function () { if (onMutated) onMutated(); render(); });
      };
    }

    fetch("/api/business-posts?business_id=" + encodeURIComponent(biz.id), { credentials: "same-origin" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!document.body.contains(el)) return;
        if (!res.ok) {
          el.innerHTML = '<div class="row" style="margin-bottom:10px"><div class="name" style="font-size:17px">Posts</div>' +
            (biz.is_owner ? '<button id="bpAddPost2" class="pri" style="padding:6px 12px;font-size:13px">Add post</button>' : "") +
            '</div><p class="mu" style="color:#ff6b6b">' + esc((res.d && res.d.error) || "Could not load posts.") + "</p>";
          var addErr = el.querySelector("#bpAddPost2");
          if (addErr) addErr.onclick = function () {
            openBizPostForm(biz.id, function () { if (onMutated) onMutated(); render(); });
          };
        } else {
          drawPosts((res.d && res.d.posts) || []);
        }
      }, function () {
        if (!document.body.contains(el)) return;
        el.innerHTML = '<div class="name" style="font-size:17px;margin-bottom:8px">Posts</div><p class="mu">Could not load posts.</p>';
      });
  };
})();

window.PX = window.PX || {};
PX.onAuthRefresh = function () {
  ["itemPage", "bizPublicPage", "bizPage", "menuPage", "notificationsPage", "privacyPage", "profileSettingsPage"].forEach(function (id) {
    var el = $(id);
    if (el && typeof el._pxRefresh === "function") {
      try { el._pxRefresh(); } catch (e) {}
    }
  });
};

render();
</script>
