# Procinity - Cloudflare Worker with Static Assets and a D1 database.
# Deploy with:  npx wrangler deploy      (Cloudflare "Workers Builds" runs this for you from GitHub)

# IMPORTANT: this name must be EXACTLY the name of the Worker in your Cloudflare dashboard.
name = "procinity"

# The real Worker entry point (the backend). This is what makes it a full-stack Worker.
main = "src/index.js"

compatibility_date = "2025-06-01"

# Keep plain-text variables you added in the dashboard (GOOGLE_CLIENT_ID, MAIL_FROM)
# instead of deleting them on every deploy. Secrets are always kept.
keep_vars = true

# ---- Static assets: your Procinity frontend (index.html, auth.js, images, icons ...) ----
[assets]
directory = "./public"
binding = "ASSETS"
# Unknown page addresses open the app instead of a 404 (it is a single-page app).
not_found_handling = "single-page-application"
# Only /api/* runs the Worker code. All other requests are answered straight from the
# static files, so pages and photos do not use up your Worker request quota.
run_worker_first = ["/api/*"]

# ---- D1 database ----
[[d1_databases]]
binding = "DB"
database_name = "procinity"
# >>> REPLACE the text below with your real Database ID from Cloudflare <<<
# Cloudflare dashboard > Storage & databases > D1 SQL database > procinity > "Database ID"
database_id = "17c6024d-df21-48d4-9be9-afbbbbe2d770"

[observability]
enabled = true
